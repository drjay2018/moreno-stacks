services:
  windows:
    image: dockurr/windows
    container_name: windows-test
    env_file: .env
    environment:
      VERSION: "10"
      USERNAME: "${WIN_USERNAME}"
      PASSWORD: "${WIN_PASSWORD}"
      RAM_SIZE: "6G"
      CPU_CORES: "2"
      DISK_SIZE: "64G"
      SHARE_PATH: "/data"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"
    volumes:
      - windows-data:/storage
      - /mnt/silo/windows-shared:/data
    restart: unless-stopped
    stop_grace_period: 2m

volumes:
  windows-data:
