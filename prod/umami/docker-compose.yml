services:
  umami-db:
    image: postgres:16
    container_name: umami-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umamipass123
      POSTGRES_DB: umami
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    networks:
      - umami-net

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:umamipass123@umami-db:5432/umami
      APP_SECRET: ${APP_SECRET}
    ports:
      - "8020:3000"
    depends_on:
      - umami-db
    networks:
      - umami-net

volumes:
  umami-db-data:

networks:
  umami-net:
    driver: bridge
